name: Alerta de Viento

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  revisar-viento:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Probar envio a Telegram (sin pronostico)
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref_name == 'mejoras/seguridad-v2' }}
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import alerta_viento as bot
          if not bot.TELEGRAM_TOKEN or not bot.TELEGRAM_CHAT_ID:
              raise SystemExit('Faltan credenciales de Telegram.')
          if not bot.enviar_telegram('✅ PRUEBA DE COMUNICACIÓN · FS Alerta Climática. No es una alerta meteorológica.'):
              raise SystemExit('Telegram no confirmó el envío.')
          print('Telegram confirmó el envío de prueba.')
          PY

      - name: Ejecutar alerta
        if: ${{ github.event_name != 'workflow_dispatch' || github.ref_name != 'mejoras/seguridad-v2' }}
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alerta_viento.py

      - name: Guardar estado
        if: ${{ github.event_name != 'workflow_dispatch' || github.ref_name != 'mejoras/seguridad-v2' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add estado_alertas.json
          git diff --quiet --cached || git commit -m "Actualizar estado de alertas [skip ci]"
          git push
