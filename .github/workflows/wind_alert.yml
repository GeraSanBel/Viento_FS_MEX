name: Alerta de Viento

on:
  schedule:
    - cron: "7 2,5,8,11,14,17,20,23 * * *"
    - cron: "37 0,3,6,9,12,15,18,21 * * *"
  workflow_dispatch:
    inputs:
      shadow_real:
        description: 'Un corte real de evaluacion tecnica (214 localidades publicas)'
        type: boolean
        default: false
        required: false

permissions:
  contents: write

concurrency:
  group: viento-${{ github.ref }}
  cancel-in-progress: false

jobs:
  revisar-viento:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Validar logica de rutina y envio (sin red)
        run: |
          python -m py_compile alerta_viento.py
          python - <<'PY'
          from datetime import datetime, timezone
          from unittest.mock import patch
          import alerta_viento as bot
          def dt(day, hour, minute=0):
              return datetime(2026, 11, day, hour, minute, tzinfo=timezone.utc)
          assert bot.rutina_por_enviar(dt(26, 14, 7), '2026-11-26-03') == '2026-11-26-14'
          assert bot.rutina_por_enviar(dt(26, 17), '2026-11-26-03') == '2026-11-26-14'
          assert bot.rutina_por_enviar(dt(26, 17), '2026-11-26-14') is None
          assert bot.rutina_por_enviar(dt(26, 22), '2026-11-26-03') == '2026-11-26-21'
          assert bot.rutina_por_enviar(dt(27, 1), '2026-11-26-14') == '2026-11-26-21'
          assert bot.rutina_por_enviar(dt(27, 3, 37), '2026-11-26-21') == '2026-11-27-03'
          assert bot.rutina_por_enviar(dt(26, 13), None) == '2026-11-26-03'
          with patch.object(bot.time, 'sleep'), patch.object(bot, 'enviar_telegram', side_effect=[True, False]) as envio:
              assert bot.enviar_lista(['a', 'b']) is False
              assert envio.call_count == 2
          with patch.object(bot.time, 'sleep'), patch.object(bot, 'enviar_telegram', return_value=True):
              assert bot.enviar_lista(['a', 'b']) is True
          print('OK: 9 pruebas de rutina y confirmacion de envio (sin red).')
          PY

      - name: Validar motor por localidad y fallos de fuentes (sin red)
        run: python -m unittest -v test_motor_alertas

      - name: Validar prioridades por sucursal (datos sinteticos, sin red)
        run: python -m unittest -v test_prioridades_sucursales

      - name: Configurar Node para pruebas de interfaz
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar interfaz piloto (sin red)
        run: node app/test_app.cjs

      - name: Validar comparador shadow sin red
        run: python -m unittest -v test_shadow_eval

      - name: Corte meteorologico real aislado
        if: ${{ github.ref_name == 'piloto/shadow-36h' && github.event_name == 'workflow_dispatch' && inputs.shadow_real }}
        run: python shadow_eval.py --evaluacion-real --salida shadow_corte.json

      - name: Conservar corte publico sin inventario privado
        if: ${{ always() && github.ref_name == 'piloto/shadow-36h' && github.event_name == 'workflow_dispatch' && inputs.shadow_real }}
        uses: actions/upload-artifact@v4
        with:
          name: shadow-corte-${{ github.run_id }}
          path: shadow_corte.json
          retention-days: 7
          if-no-files-found: warn

      - name: Ejecutar alerta
        if: ${{ github.ref_name == 'main' }}
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alerta_viento.py

      - name: Guardar estado
        if: ${{ github.ref_name == 'main' }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add estado_alertas.json
          if ! git diff --quiet --cached; then
            git commit -m "Actualizar estado de alertas [skip ci]"
            git push origin HEAD:main
          fi
