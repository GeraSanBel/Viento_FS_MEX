name: Agregar Municipios Adicionales (uso unico)

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  agregar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install requests

      - name: Agregar municipios
        env:
          OWM_API_KEY: ${{ secrets.OWM_API_KEY }}
        run: python geocode_adicionales.py

      - name: Guardar resultados
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add municipios_coords.json adicionales_para_revisar.txt
          git diff --quiet --cached || git commit -m "Agregar municipios del Estado de Mexico"
          git pull --rebase
          git push
